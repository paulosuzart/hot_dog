[package]
name = "hot_dog"
version = "0.1.0"
authors = ["paulosuzart <paulosuzart@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = {version = "0.4.43", features = ["serde"] }
dioxus = { version = "0.7.3", features = ["router", "fullstack", "logger"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
libsql = { version = "0.9.29", optional = true }
tokio = { version = "1.49.0", features = ["sync", "rt-multi-thread", "net"], optional = true }
serde = "1.0.228"
serde_json = "1.0.133"
tracing = "0.1.44"
base64 = {version = "0.22.1", optional = true}
axum-prometheus = {version = "0.10.0", optional = true}
axum = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", optional = true }


[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:libsql", "dep:tokio", "dep:base64", "dep:axum-prometheus", "dep:axum", "dep:tracing-subscriber"]
